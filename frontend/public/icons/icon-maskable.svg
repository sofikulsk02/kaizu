<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5374C"/>
      <stop offset="50%" stop-color="#B83245"/>
      <stop offset="100%" stop-color="#8E1F30"/>
    </linearGradient>
    <filter id="kanjiShadowM" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4A0E18" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Full edge-to-edge bleed background for maskable spec -->
  <rect width="512" height="512" fill="url(#bgGradM)"/>

  <!-- Inner circle safe area accent -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#F5E6CC" stroke-width="3" stroke-opacity="0.35"/>

  <!-- Japanese Kanji 改善 (Kaizen) positioned within 80% safe zone -->
  <text 
    x="256" 
    y="305" 
    font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Segoe UI', sans-serif" 
    font-size="165" 
    font-weight="900" 
    text-anchor="middle" 
    fill="#FFFFFF" 
    filter="url(#kanjiShadowM)"
    letter-spacing="2"
  >改善</text>

  <rect x="206" y="365" width="100" height="24" rx="12" fill="#FAF7F0" fill-opacity="0.2"/>
  <text 
    x="256" 
    y="382" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-size="14" 
    font-weight="800" 
    letter-spacing="4" 
    text-anchor="middle" 
    fill="#FAF7F0"
  >KAIZU</text>
</svg>