<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="arcGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B83245"/>
      <stop offset="40%" stop-color="#244633"/>
      <stop offset="100%" stop-color="#244633"/>
    </linearGradient>
  </defs>

  <!-- Full edge-to-edge bleed background for maskable spec -->
  <rect width="512" height="512" fill="#F4EFE3"/>

  <!-- Centered round loader positioned within safe zone -->
  <g transform="translate(256, 256)">
    <!-- Subtle circular track -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#E2DAC8" stroke-width="16"/>

    <!-- Dynamic round spinning arc (forest green to crimson) -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="url(#arcGradM)" stroke-width="18" stroke-linecap="round" stroke-dasharray="754" stroke-dashoffset="260" transform="rotate(-45)"/>
  </g>
</svg>